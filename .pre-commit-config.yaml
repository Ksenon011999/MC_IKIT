repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff formatter
        entry: ruff format --check
        language: python
        additional_dependencies: ["ruff==0.11.13"]
        types_or: [python, pyi]
      - id: ruff-lint
        name: Ruff linter
        entry: ruff check
        language: python
        additional_dependencies: ["ruff==0.11.13"]
        types_or: [python, pyi]
